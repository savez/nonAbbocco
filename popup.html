<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>NonAbbocco — Ranking della pagina</title>
  <style>
    :root { color-scheme: dark; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0b1120; color: #f8fafc;
      margin: 0; padding: 16px; width: 344px;
      font-size: 13px; line-height: 1.45;
    }

    /* ─── Testata: il rango e cosa significa ─────────────────────────────── */
    .verdict { display: flex; gap: 12px; align-items: flex-start; }
    .rank {
      flex: 0 0 auto; width: 52px; height: 52px; border-radius: 16px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      border: 1px solid; font-weight: 800;
    }
    .rank .n { font-size: 22px; line-height: 1; }
    .rank .of { font-size: 9px; opacity: 0.75; letter-spacing: 0.5px; }
    .verdict h1 { font-size: 15px; margin: 2px 0 4px; font-weight: 700; }
    .verdict p { margin: 0; font-size: 12px; color: #cbd5e1; }

    /* ─── Sezioni ────────────────────────────────────────────────────────── */
    section { margin-top: 16px; }
    h2 {
      font-size: 10px; text-transform: uppercase; letter-spacing: 0.8px;
      color: #94a3b8; margin: 0 0 8px; font-weight: 700;
    }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 12px; }

    /* ─── Anatomia dell'indirizzo ────────────────────────────────────────── */
    .address { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; word-break: break-all; }
    .address .prefix { color: #64748b; }
    .address .registrable { color: #f8fafc; font-weight: 700; border-bottom: 2px solid #6366f1; }
    .address .note { display: block; font-family: inherit; font-size: 11px; color: #94a3b8; margin-top: 6px; }
    .unicode { display: block; margin-top: 6px; color: #fde68a; font-size: 12px; }

    /* ─── Le quattro categorie ───────────────────────────────────────────── */
    .cat { display: flex; align-items: center; gap: 10px; padding: 6px 0; }
    .cat + .cat { border-top: 1px solid #334155; }
    .cat .txt { flex: 1; min-width: 0; }
    .cat .name { font-size: 12px; font-weight: 600; }
    .cat .q { font-size: 10px; color: #94a3b8; }
    .ticks { display: flex; gap: 3px; flex: 0 0 auto; }
    .tick { width: 16px; height: 6px; border-radius: 3px; background: #334155; }
    .cat.off .name { color: #94a3b8; }

    /* ─── Elenchi ────────────────────────────────────────────────────────── */
    ul { margin: 0; padding-left: 18px; }
    li { margin-bottom: 6px; }
    li:last-child { margin-bottom: 0; }
    .muted { color: #94a3b8; }
    .empty { color: #94a3b8; font-size: 12px; margin: 0; }

    /* ─── Piede ──────────────────────────────────────────────────────────── */
    footer { margin-top: 16px; font-size: 11px; color: #64748b; }
    .warn {
      margin-top: 10px; font-size: 11px; color: #fde68a;
      background: rgba(245, 158, 11, 0.1); border: 1px solid rgba(245, 158, 11, 0.35);
      border-radius: 10px; padding: 8px 10px;
    }

    /* ─── Stato "non analizzata" ─────────────────────────────────────────── */
    .unknown h1 { font-size: 14px; margin: 0 0 6px; }
    .unknown p { margin: 0; color: #94a3b8; font-size: 12px; }
  </style>
</head>
<body>
  <main id="root" aria-live="polite"></main>
  <script type="module" src="popup.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>NonAbbocco - Configurazione Soglie</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #0b1120; color: #f8fafc; padding: 24px; margin: 0; }
    .card { max-width: 480px; margin: 0 auto; background: #1e293b; border-radius: 16px; padding: 24px; border: 1px solid #334155; }
    h2 { font-size: 18px; margin-top: 0; display: flex; align-items: center; gap: 8px; }
    label { font-size: 13px; color: #cbd5e1; display: block; margin: 12px 0 6px; }
    select { width: 100%; background: #0f172a; color: #f8fafc; border: 1px solid #475569; border-radius: 8px; padding: 10px; font-size: 13px; }
    .desc { font-size: 11px; color: #94a3b8; margin-top: 6px; line-height: 1.4; }
    button { width: 100%; margin-top: 20px; background: #e11d48; color: #fff; border: none; padding: 11px; font-weight: bold; border-radius: 8px; cursor: pointer; }
    button:hover { background: #f43f5e; }
    .msg { margin-top: 10px; font-size: 12px; text-align: center; color: #34d399; display: none; }
  </style>
</head>
<body>
  <div class="card">
    <h2>🎣 NonAbbocco Defender - Impostazioni</h2>
    <label for="threshold">Soglia Minima per Blocco a Schermo Intero:</label>
    <select id="threshold">
      <option value="5" selected>Livello 5 (Default: Solo Minaccia Critica Conclamata)</option>
      <option value="4">Livello 4 e 5 (Blocca anche Rischio Elevato)</option>
      <option value="3">Livello 3, 4 e 5 (Blocca anche Sospetto Moderato)</option>
      <option value="2">Livello 2 in su (Massima Allerta)</option>
    </select>
    <p class="desc">I livelli inferiori alla soglia prescelta mostreranno una pillola informativa discreta con il relativo ranking visibile senza bloccare la pagina.</p>
    <button id="save">Salva Impostazioni</button>
    <div id="status" class="msg" role="status" aria-live="polite"></div>
  </div>

  <script src="options.js"></script>
</body>
</html>

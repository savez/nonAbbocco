      <text x="26" y="25" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700" fill="#34d399">2</text>
      <text x="14" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8">Qualche anomalia</text>
    </g>
    <g transform="translate(552 268)">
      <rect width="122" height="60" rx="12" fill="#0f172a" stroke="#fbbf24" stroke-opacity="0.35"/>
      <circle cx="15" cy="21" r="3.5" fill="#fbbf24"/>
      <text x="26" y="25" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700" fill="#fbbf24">3</text>
      <text x="14" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8">Sospetto moderato</text>
    </g>
    <g transform="translate(678 268)">
      <rect width="122" height="60" rx="12" fill="#0f172a" stroke="#f97316" stroke-opacity="0.35"/>
      <circle cx="15" cy="21" r="3.5" fill="#f97316"/>
      <text x="26" y="25" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700" fill="#f97316">4</text>
      <text x="14" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8">Rischio elevato</text>
    </g>
    <g transform="translate(804 268)">
      <rect width="122" height="60" rx="12" fill="#0f172a" stroke="#f43f5e" stroke-opacity="0.35"/>
      <circle cx="15" cy="21" r="3.5" fill="#f43f5e"/>
      <text x="26" y="25" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700" fill="#f43f5e">5</text>
      <text x="14" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8">Minaccia confermata</text>
    </g>

  <text x="926" y="376" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#475569">Manifest V3 · MIT · nessuna telemetria</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1010" height="400" viewBox="0 0 1010 400" role="img" aria-label="NonAbbocco — difesa anti-phishing per Chrome e Firefox con ranking di rischio da 1 a 5">
  <title>NonAbbocco</title>
  <desc>Estensione Chrome e Firefox anti-phishing: analizza URL e DOM, calcola un ranking di rischio da 1 a 5 e sostituisce le pagine di phishing con un interstiziale non manomettibile.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1120"/>
      <stop offset="0.55" stop-color="#0d1424"/>
      <stop offset="1" stop-color="#131a2e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.16" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#f43f5e" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#f43f5e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.82" cy="0.85" r="0.6">
      <stop offset="0" stop-color="#4f46e5" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#4f46e5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="0.5" stop-color="#f43f5e"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
  </defs>

  <rect width="1010" height="400" fill="url(#bg)"/>
  <rect width="1010" height="400" fill="url(#glow)"/>
  <rect width="1010" height="400" fill="url(#glow2)"/>
  <rect width="1010" height="4" fill="url(#rule)"/>

  <!-- Il marchio: lo stesso disegno delle icone dell'estensione -->
  <image x="80" y="116" width="168" height="168" href="data:image/png;base64," />

  <g transform="translate(300 0)">
    <text x="0" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="62" font-weight="800" letter-spacing="-1.5" fill="#ffffff">NonAbbocco</text>
    <text x="0" y="168" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="500" fill="#cbd5e1">Non abboccare all'esca del phishing.</text>
    <text x="0" y="192" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" fill="#64748b">Estensione Chrome e Firefox · analisi locale · ranking di rischio 1-5</text>
  </g>

    <g transform="translate(300 222)">
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="800" fill="#f8fafc">22</text>
      <text x="0" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#64748b">regole</text>
    </g>
    <g transform="translate(426 222)">
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="800" fill="#f8fafc">50</text>
      <text x="0" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#64748b">marchi</text>
    </g>
    <g transform="translate(552 222)">
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="800" fill="#f8fafc">150</text>
      <text x="0" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#64748b">domini noti</text>
    </g>
    <g transform="translate(678 222)">
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="800" fill="#f8fafc">~15µs</text>
      <text x="0" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#64748b">per controllo</text>
    </g>

    <g transform="translate(300 268)">
      <rect width="122" height="60" rx="12" fill="#0f172a" stroke="#34d399" stroke-opacity="0.35"/>
      <circle cx="15" cy="21" r="3.5" fill="#34d399"/>
      <text x="26" y="25" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700" fill="#34d399">1</text>
      <text x="14" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8">Nessun segnale noto</text>

name: pages-landing

# Pubblica la landing dal branch `landing`, come per Bacco e Fidelity Card.
# Il branch `landing` non va MAI unito a `main`.
#
# La pagina è `simulator.html`, generata da tools/build-page.mjs, servita come
# index. Il simulatore importa `src/scoring.js` e il catalogo delle regole nasce
# da `src/rules.js`: per non mostrare un motore vecchio, il deploy prende `src/`
# e `package.json` (versione) da `origin/main` e rigenera la pagina con il
# template di questo branch. Le modifiche al motore fatte su main arrivano sul
# sito al push successivo su `landing` (o rilanciando questo workflow su
# `landing`): un cron qui non partirebbe, perché GitHub esegue i `schedule`
# solo dal branch di default.

on:
  push:
    branches: [landing]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Motore e versione da main
        run: |
          git fetch --depth=1 origin main:refs/remotes/origin/main
          git checkout origin/main -- src package.json
          echo "Motore da main: $(git rev-parse --short origin/main), versione $(node -p "require('./package.json').version")" >> "$GITHUB_STEP_SUMMARY"

      - name: Generazione della pagina
        run: node tools/build-page.mjs

      - name: Composizione del sito
        run: |
          mkdir -p _site
          cp simulator.html _site/index.html
          cp -r src _site/src
          cp -r assets _site/assets
          cp -r icons _site/icons
          echo "File pubblicati:" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          find _site -type f | sort | sed 's|_site/||' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

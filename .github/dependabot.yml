# Le Actions sono pinnate per SHA: Dependabot aggiorna SHA e commento
# `# vX.Y.Z` insieme, così il pin non resta fermo su una versione vecchia.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ['*']

  # `landing` ha i suoi workflow (pages-landing.yml) e non va MAI unito a
  # `main`: le PR di Dependabot per questo blocco puntano a `landing`.
  - package-ecosystem: github-actions
    directory: /
    target-branch: landing
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ['*']
